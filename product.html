<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/images/vinka-logo.png">
  <link rel="stylesheet" href="style.css">
  <title>Product | Vinka Traditional Shop</title>
</head>
<body>

<header>
  <div class="container nav">
    <a href="index.html" class="logo"><img src="assets/images/vinka-logo.png" alt="Vinka Traditional Shop"></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="index.html#about">About</a>
      <a href="https://wa.me/27603486752?text=Hi%20Vinka%2C%20I%27d%20like%20to%20get%20in%20touch." target="_blank" rel="noopener">Contact</a>
      <a href="cart.html">Cart</a>
    </nav>
  </div>
</header>

<section class="product-detail container" id="product-detail">
  <p class="loading">Loading…</p>
</section>

<footer>
  <div class="container">
    <h3>VINKA TRADITIONAL SHOP</h3>
    <p>Traditional products. Cultural identity. Modern shopping.</p>
    <p>© 2026 Vinka Traditional Shop</p>
  </div>
</footer>

<a class="wa-float" href="https://wa.me/27603486752?text=Hi%20Vinka%2C%20I%27d%20like%20to%20know%20more%20about%20your%20products." target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg viewBox="0 0 32 32" width="28" height="28" fill="#fff"><path d="M16 3C9 3 3.4 8.6 3.4 15.6c0 2.3.6 4.4 1.7 6.3L3 29l7.3-1.9c1.8 1 3.8 1.5 5.7 1.5 7 0 12.6-5.6 12.6-12.6S23 3 16 3zm0 23c-1.8 0-3.6-.5-5.1-1.4l-.4-.2-4.3 1.1 1.2-4.2-.3-.4a10.3 10.3 0 1 1 8.9 5.1zm5.7-7.7c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.5.1-.2.1-.4 0-.6l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.2 3.3 1.4 3.5c.2.2 2.4 3.7 5.9 5.1 2.2.9 3 .8 3.6.7.5-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
</a>

<script src="products.js"></script>
<script>
  const box = document.getElementById("product-detail");
  const id = new URLSearchParams(window.location.search).get("item");
  const p = PRODUCTS.find(x => x.id === id);

  if(!p){
    box.innerHTML = `<div class="not-found"><h1>Product not found</h1>
      <p><a href="shop.html">← Back to the shop</a></p></div>`;
  } else {
    document.title = p.name + " | Vinka Traditional Shop";
    box.innerHTML = `
      <a class="back-link" href="shop.html">← Back to the shop</a>
      <div class="detail-grid">
        <div class="detail-image"><img src="${p.image}" alt="${p.name}"></div>
        <div class="detail-info">
          <span class="cat">${p.category}</span>
          <h1>${p.name}</h1>
          <p class="detail-price">Message us for the price</p>
          <p class="detail-desc">${p.description}</p>
          <a class="btn btn-wa-big" target="_blank" rel="noopener"
             href="${waLink("Hi, I'm interested in the " + p.name + ". Is it available?")}">Order via WhatsApp</a>
        </div>
      </div>`;
  }
</script>

</body>
</html>
